# repository root and catalogs are po/mainuan-gestao-drivers-<lang>.po.
DOMAIN=mainuan-gestao-drivers
PACKAGE_NAME="Mainuan Gestão de Drivers"
PACKAGE_VERSION=1.1
POT="$ROOT/mainuan-gestao-drivers.pot"
PO_NAME="mainuan-gestao-drivers-%s.po"
BUGS_ADDRESS=https://github.com/mainuan/mainuan-gestao-drivers/issues
